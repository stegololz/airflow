---
package-name: apache-airflow-providers-microsoft-identity
name: Microsoft Identity
description: |
  Auth managers for Microsoft identity providers:
  `Microsoft AD FS <https://learn.microsoft.com/windows-server/identity/ad-fs/>`__.

state: not-ready
lifecycle: incubation
source-date-epoch: 1792415190
# Note that those versions are maintained by release manager - do not update them manually
versions:
  - 0.1.0

integrations:
  - integration-name: Microsoft AD FS
    external-doc-url: https://learn.microsoft.com/windows-server/identity/ad-fs/development/
    tags: [software]

auth-managers:
  - airflow.providers.microsoft.identity.auth_manager.adfs_auth_manager.AdfsAuthManager

config:
  adfs_auth_manager:
    description: This section contains settings for the Microsoft AD FS auth manager.
    options:
      issuer:
        description: |
          AD FS issuer URL, for example ``https://adfs.example.com/adfs``. The OpenID Connect discovery
          document is read from ``<issuer>/.well-known/openid-configuration`` and its ``issuer`` value
          must match this setting. Must use ``https``.
        type: string
        version_added: 0.1.0
        example: "https://adfs.example.com/adfs"
        default: ~
      client_id:
        description: |
          Client identifier of the Airflow application in the AD FS application group. The ID token
          audience must be this value.
        type: string
        version_added: 0.1.0
        example: ~
        default: ~
      client_secret:
        description: |
          Secret of the Airflow server application in the AD FS application group. Leave empty when
          Airflow is registered as a public (native) client; PKCE is used in both cases.
        type: string
        sensitive: true
        version_added: 0.1.0
        example: ~
        default: ""
      scope:
        description: |
          Space-separated scopes requested from AD FS. ``allatclaims`` asks AD FS to include the claims
          produced by the issuance transform rules in the ID token. Which claims are issued is decided by
          the issuance transform rules configured in AD FS, not by the requested scopes.
        type: string
        version_added: 0.1.0
        example: ~
        default: "openid profile email allatclaims"
      resource:
        description: |
          Optional identifier of an AD FS Web API sent as the ``resource`` parameter. When set, the access
          token is validated (its audience must be this value) and its claims are used in addition to the
          ID token claims. When empty, the access token is not used.
        type: string
        version_added: 0.1.0
        example: "https://airflow.example.com/api"
        default: ""
      access_token_issuers:
        description: |
          Comma-separated list of accepted ``iss`` values for access tokens. Only used when ``resource`` is
          set. When empty, the ``issuer`` and ``access_token_issuer`` values of the discovery document are
          accepted (AD FS issues access tokens with ``http://<host>/adfs/services/trust``).
        type: string
        version_added: 0.1.0
        example: "http://adfs.example.com/adfs/services/trust"
        default: ""
      username_claims:
        description: |
          Comma-separated list of claims used to build the Airflow username. The first claim holding a
          non-empty string is used.
        type: string
        version_added: 0.1.0
        example: ~
        default: "upn,unique_name,email,sub"
      strip_domain_prefix:
        description: |
          Remove a ``DOMAIN\`` prefix from the username, so that ``EXAMPLE\jdoe`` becomes ``jdoe``.
          Enable it only if user names are unique across all domains trusted by AD FS.
        type: boolean
        version_added: 0.1.0
        example: ~
        default: "False"
      roles_claims:
        description: |
          Comma-separated list of claims holding the group or role values matched against
          ``role_mapping``. Values of all listed claims are combined. Each claim may hold a single
          string or a list of strings.
        type: string
        version_added: 0.1.0
        example: ~
        default: "role,roles,group,groups,http://schemas.microsoft.com/ws/2008/06/identity/claims/role"
      role_mapping:
        description: |
          JSON object mapping group or role claim values to global Airflow roles. Keys are matched
          case-insensitively. Allowed roles are ``VIEWER``, ``USER``, ``OP`` and ``ADMIN``. When several
          values match, the highest role is used. Optional in multi-team mode when
          ``team_role_mapping`` is set.
        type: string
        version_added: 0.1.0
        example: '{"Airflow Admins": "ADMIN", "Airflow Operators": "OP", "Airflow Users": "USER"}'
        default: ~
      team_role_mapping:
        description: |
          JSON object mapping group or role claim values to a role in a team, as ``"<team>:<role>"``
          strings, in multi-team mode. Keys are matched case-insensitively. When several values match
          the same team, the highest role is used. Only users with a global ``ADMIN`` role from
          ``role_mapping`` access every team.
        type: string
        version_added: 0.1.0
        example: '{"Airflow team-a Operators": "team-a:OP", "Airflow team-b Viewers": "team-b:VIEWER"}'
        default: ""
      default_role:
        description: |
          Airflow role given to an authenticated user whose claims do not match ``role_mapping``. When
          empty, such users are denied access.
        type: string
        version_added: 0.1.0
        example: "VIEWER"
        default: ""
      leeway_seconds:
        description: |
          Clock skew tolerated when validating the ``exp``, ``iat`` and ``nbf`` claims of tokens.
        type: integer
        version_added: 0.1.0
        example: ~
        default: "30"
      ca_bundle_path:
        description: |
          Path to a CA bundle used to verify the TLS certificate of AD FS, for AD FS servers using a
          certificate issued by an internal certificate authority. When empty, the ``REQUESTS_CA_BUNDLE``
          environment variable or the ``certifi`` bundle is used.
        type: string
        version_added: 0.1.0
        example: "/etc/ssl/certs/internal-ca.pem"
        default: ""
      request_timeout_seconds:
        description: |
          Timeout of the HTTP requests made to AD FS (discovery, signing keys and token endpoint).
        type: integer
        version_added: 0.1.0
        example: ~
        default: "10"
      jwks_cache_ttl_seconds:
        description: |
          Time during which the AD FS token signing keys are cached. Keys are fetched again before this
          delay when a token is signed with an unknown key, for example after a certificate rollover.
        type: integer
        version_added: 0.1.0
        example: ~
        default: "300"
      logout_from_adfs:
        description: |
          Redirect the user to the AD FS logout endpoint when logging out of Airflow, which also ends
          the AD FS single sign-on session.
        type: boolean
        version_added: 0.1.0
        example: ~
        default: "True"
